name: Testes Radar Switch

on:
  push:
    branches: [main]
    paths:
      - 'radar/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Compilar Python
        run: python -m compileall -q radar tests
      - name: Executar testes
        run: python -m pytest -q
      - name: Verificar API Nintendo BR com preços reais (sem enviar e-mail)
        run: python -m radar.live_probe
