
"""Radar Nintendo Switch — Monitor de promoções da eShop Brasil."""

from __future__ import annotations

import argparse
import html
import json
import logging
import os
import smtplib
import sys
import time

from datetime import datetime
from email.message import EmailMessage
from pathlib import Path
from urllib.parse import urlparse

import requests

from .core import (
    BR,
    Offer,
    discovery,
    parse_detail,
    qualifies,
    select_alerts,
)

ROOT = Path(__file__).resolve().parents[1]

HEADERS = {
    "User-Agent": (
        "Mozilla/5.0 (compatible; "
        "RadarSwitchMVP/1.1; personal-deal-checker)"
    ),
    "Accept-Language": "pt-BR,pt;q=0.9",
}

LOG = logging.getLogger("radar-switch")


# ==========================================================
# CONSULTA HTTP
# ==========================================================

def fetch(session: requests.Session, url: str) -> str:
    LOG.info("Consultando: %s", url)

    response = session.get(
        url,
        headers=HEADERS,
        timeout=(10, 25),
        allow_redirects=True,
    )

    response.raise_for_status()

    hostname = urlparse(response.url).hostname

    if hostname != "valeojogo.com.br":
        raise RuntimeError(
            f"Redirecionamento inesperado: {response.url}"
        )

    if len(response.content) < 500:
        raise RuntimeError(
            f"HTML incompleto: {len(response.content)} bytes"
        )

    LOG.info(
        "HTTP %s | %d bytes",
        response.status_code,
        len(response.content),
    )

    return response.text


# ==========================================================
# FORMATAÇÃO
# ==========================================================

def money_brl(value) -> str:
    number = f"{float(value):,.2f}"
    number = number.replace(",", "X")
    number = number.replace(".", ",")
    number = number.replace("X", ".")

    return f"R$ {number}"


# ==========================================================
# MONTAGEM DO E-MAIL
# ==========================================================

def format_email(
    offers: list[Offer],
    max_items: int,
) -> tuple[str, str]:

    shown = offers[:max_items]

    timestamp = datetime.now(BR).strftime(
        "%d/%m/%Y %H:%M"
    )

    lines = [
        f"Radar Nintendo Switch — {len(offers)} nova(s) oferta(s)",
        f"Consulta: {timestamp} (Brasília)",
        "",
        "Jogos digitais da Nintendo eShop Brasil:",
        "",
    ]

    blocks = []

    for offer in shown:
        lines.extend([
            (
                f"{offer.title} | {money_brl(offer.price)} "
                f"(antes {money_brl(offer.old_price)}) "
                f"| -{offer.discount}%"
            ),
            (
                f"Crítica: {offer.critic}/100 | "
                f"Jogadores: {offer.player_positive}% "
                f"({offer.player_reviews} análises)"
            ),
            f"Nintendo: {offer.shop_url}",
            f"Fonte: {offer.page_url}",
            "",
        ])

        blocks.append(
            "<tr>"
            "<td style='padding:18px;"
            "border-bottom:1px solid #e5e7eb'>"
            f"<strong>{html.escape(offer.title)}</strong><br>"
            "<span style='font-size:22px;"
            "color:#047857;font-weight:bold'>"
            f"{money_brl(offer.price)}</span><br>"
            f"Antes: {money_brl(offer.old_price)} "
            f"(-{offer.discount}%)<br>"
            f"Crítica: {offer.critic}/100<br>"
            f"Jogadores: {offer.player_positive}% "
            f"({offer.player_reviews} avaliações)<br><br>"
            f"<a href='{html.escape(offer.shop_url, quote=True)}'>"
            "Ver na Nintendo eShop</a><br>"
            f"<a href='{html.escape(offer.page_url, quote=True)}'>"
            "Conferir preço e avaliações</a>"
            "</td>"
            "</tr>"
        )

    if len(offers) > len(shown):
        lines.append(
            f"Mais {len(offers) - len(shown)} ofertas "
            "omitidas neste e-mail."
        )

    lines.append(
        "Confira sempre o preço final na Nintendo "
        "eShop antes de comprar."
    )

    plain_text = "\n".join(lines)

    html_body = (
        "<html><body style='background:#f4f6f8;"
        "padding:20px;font-family:Arial,sans-serif'>"
        "<div style='max-width:640px;margin:auto;"
        "background:white;padding:24px;"
        "border-radius:12px'>"
        "<h2>Radar Nintendo Switch</h2>"
        f"<p>{len(offers)} nova(s) oferta(s) "
        f"encontrada(s) em {timestamp}</p>"
        "<table style='width:100%;border-collapse:collapse'>"
        f"{''.join(blocks)}"
        "</table>"
        "<p style='font-size:12px;color:#6b7280'>"
        "Preços sujeitos a alterações. "
        "Confira o valor final antes da compra."
        "</p></div></body></html>"
    )

    return plain_text, html_body


# ==========================================================
# ENVIO SMTP
# ==========================================================

def email_alert(
    offers: list[Offer],
    max_items: int,
) -> None:

    required = [
        "SMTP_HOST",
        "SMTP_PORT",
        "SMTP_USER",
        "SMTP_PASSWORD",
        "EMAIL_TO",
    ]

    missing = [
        name for name in required
        if not os.getenv(name)
    ]

    if missing:
        raise RuntimeError(
            "Secrets SMTP ausentes: " + ", ".join(missing)
        )

    LOG.info("Preparando e-mail com %d ofertas", len(offers))

    message = EmailMessage()

    message["From"] = (
        os.getenv("EMAIL_FROM")
        or os.environ["SMTP_USER"]
    )

    message["To"] = os.environ["EMAIL_TO"]

    message["Subject"] = (
        f"[Radar Switch] {len(offers)} "
        "promoção(ões) nova(s) até R$ 100"
    )

    plain, rich = format_email(
        offers,
        max_items,
    )

    message.set_content(plain)
    message.add_alternative(rich, subtype="html")

    host = os.environ["SMTP_HOST"]
    port = int(os.environ["SMTP_PORT"])

    LOG.info("Conectando ao servidor SMTP: porta %d", port)

    if port == 465:
        with smtplib.SMTP_SSL(
            host,
            port,
            timeout=30,
        ) as smtp:

            smtp.login(
                os.environ["SMTP_USER"],
                os.environ["SMTP_PASSWORD"],
            )

            smtp.send_message(message)

    elif port == 587:
        with smtplib.SMTP(
            host,
            port,
            timeout=30,
        ) as smtp:

            smtp.ehlo()
            smtp.starttls()
            smtp.ehlo()

            smtp.login(
                os.environ["SMTP_USER"],
                os.environ["SMTP_PASSWORD"],
            )

            smtp.send_message(message)

    else:
        raise ValueError(
            "SMTP_PORT deve ser 465 ou 587"
        )

    LOG.info("E-mail aceito pelo servidor SMTP")


# ==========================================================
# MONITORAMENTO
# ==========================================================

def main(argv: list[str] | None = None) -> int:

    parser = argparse.ArgumentParser()

    parser.add_argument(
        "--dry-run",
        action="store_true",
        help="Executar sem enviar e-mail ou alterar estado",
    )

    parser.add_argument(
        "--send-initial",
        action="store_true",
        help="Enviar ofertas da primeira execução",
    )

    args = parser.parse_args(argv)

    LOG.info("=" * 55)
    LOG.info("RADAR NINTENDO SWITCH")
    LOG.info("=" * 55)

    settings_file = ROOT / "config/settings.json"
    state_file = ROOT / "data/state.json"

    settings = json.loads(
        settings_file.read_text(encoding="utf-8")
    )

    state = json.loads(
        state_file.read_text(encoding="utf-8")
    )

    LOG.info(
        "Preço máximo: R$ %s",
        settings["max_price_brl"],
    )

    LOG.info(
        "Desconto mínimo: %s%%",
        settings["min_discount_percent"],
    )

    LOG.info(
        "Nota mínima da crítica: %s",
        settings["min_critic_score"],
    )

    LOG.info(
        "Avaliação positiva mínima: %s%%",
        settings["min_player_positive_percent"],
    )

    session = requests.Session()

    source_url = settings["source_url"]

    # ------------------------------------------------------
    # DESCOBERTA
    # ------------------------------------------------------

    LOG.info("Iniciando descoberta de promoções")

    html_listing = fetch(
        session,
        source_url,
    )

    urls = discovery(
        html_listing,
        source_url,
        int(settings["max_source_age_hours"]),
    )

    LOG.info(
        "Candidatos na vitrine: %d",
        len(urls),
    )

    # ------------------------------------------------------
    # ANÁLISE INDIVIDUAL
    # ------------------------------------------------------

    offers: list[Offer] = []

    failed = 0
    unrecognized = 0
    rejected = 0

    for i, url in enumerate(urls, 1):

        LOG.info("-" * 45)

        LOG.info(
            "Analisando jogo %d/%d",
            i,
            len(urls),
        )

        if i > 1:
            time.sleep(
                float(settings["request_delay_seconds"])
            )

        try:
            game_html = fetch(
                session,
                url,
            )

            offer = parse_detail(
                game_html,
                url,
            )

            if offer is None:
                unrecognized += 1

                LOG.warning(
                    "Oferta não reconhecida pelo parser: %s",
                    url,
                )

                continue

            LOG.info(
                "Jogo: %s | Preço: %s | Desconto: %d%%",
                offer.title,
                money_brl(offer.price),
                offer.discount,
            )

            LOG.info(
                "Crítica: %d | Jogadores: %d%% | "
                "Avaliações: %d",
                offer.critic,
                offer.player_positive,
                offer.player_reviews,
            )

            if qualifies(offer, settings):

                offers.append(offer)

                LOG.info(
                    "APROVADO: %s",
                    offer.title,
                )

            else:
                rejected += 1

                LOG.info(
                    "Fora dos filtros: %s",
                    offer.title,
                )

        except (
            requests.RequestException,
            RuntimeError,
            ValueError,
        ):
            failed += 1

            LOG.exception(
                "Erro ao analisar o jogo: %s",
                url,
            )

    # ------------------------------------------------------
    # RESUMO
    # ------------------------------------------------------

    LOG.info("=" * 55)
    LOG.info("RESUMO DO MONITORAMENTO")
    LOG.info("=" * 55)

    LOG.info("Candidatos: %d", len(urls))
    LOG.info("Elegíveis: %d", len(offers))
    LOG.info("Fora dos filtros: %d", rejected)
    LOG.info("Não reconhecidos: %d", unrecognized)
    LOG.info("Erros de consulta: %d", failed)

    # ------------------------------------------------------
    # VALIDAÇÃO DA COLETA
    # ------------------------------------------------------

    if failed:
        raise RuntimeError(
            f"Falharam {failed}/{len(urls)} consultas. "
            "Histórico preservado."
        )

    if not offers and len(urls) >= 5:
        raise RuntimeError(
            "Nenhum jogo elegível encontrado. "
            f"Não reconhecidos: {unrecognized}. "
            f"Fora dos filtros: {rejected}. "
            "Verifique o parser antes de atualizar o histórico."
        )

    # ------------------------------------------------------
    # DETECÇÃO DE NOVAS PROMOÇÕES
    # ------------------------------------------------------

    alerts, new_state = select_alerts(
        offers,
        state,
        bootstrap=not args.send_initial,
    )

    LOG.info(
        "Jogos elegíveis: %d | Novos alertas: %d",
        len(offers),
        len(alerts),
    )

    # ------------------------------------------------------
    # MODO DE TESTE
    # ------------------------------------------------------

    if args.dry_run:

        for offer in alerts:
            LOG.info(
                "DRY RUN: %s | %s | -%d%%",
                offer.title,
                money_brl(offer.price),
                offer.discount,
            )

        LOG.info(
            "DRY RUN concluído: nenhum e-mail enviado "
            "e nenhum estado alterado."
        )

        return 0

    # ------------------------------------------------------
    # ENVIO DOS ALERTAS
    # ------------------------------------------------------

    if alerts:

        LOG.info(
            "Enviando %d novas promoções",
            len(alerts),
        )

        email_alert(
            alerts,
            int(settings["max_games_per_email"]),
        )

    else:

        LOG.info(
            "Nenhuma nova promoção para notificar."
        )

    # ------------------------------------------------------
    # PERSISTÊNCIA DO HISTÓRICO
    # ------------------------------------------------------

    state_file.write_text(
        json.dumps(
            new_state,
            ensure_ascii=False,
            indent=2,
            sort_keys=True,
        ) + "\n",
        encoding="utf-8",
    )

    LOG.info("Histórico de ofertas atualizado")

    LOG.info("MONITORAMENTO CONCLUÍDO")

    return 0


# ==========================================================
# EXECUÇÃO
# ==========================================================

if __name__ == "__main__":

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s %(levelname)s %(message)s",
        stream=sys.stdout,
        force=True,
    )

    try:
        sys.exit(main())

    except Exception:
        LOG.exception(
            "Monitoramento interrompido. "
            "Estado não atualizado."
        )

        sys.exit(1)
