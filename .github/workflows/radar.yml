name: Radar Nintendo Switch

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      send_initial:
        description: 'Enviar ofertas atuais mesmo no primeiro monitoramento?'
        required: false
        type: boolean
        default: false
      test_email:
        description: 'Enviar e-mail de teste SMTP, sem consultar jogos?'
        required: false
        type: boolean
        default: false
      preview_email:
        description: 'Enviar prévia visual das ofertas atuais (não altera histórico)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-nintendo-switch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar parser
        run: python -m pytest -q
      - name: Consultar ofertas e enviar alertas
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SEND_INITIAL: ${{ inputs.send_initial }}
          TEST_EMAIL: ${{ inputs.test_email }}
          PREVIEW_EMAIL: ${{ inputs.preview_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python -m radar.main --test-email
          elif [ "$PREVIEW_EMAIL" = "true" ]; then
            python -m radar.main --preview-email
          elif [ "$SEND_INITIAL" = "true" ]; then
            python -m radar.main --send-initial
          else
            python -m radar.main
          fi
      - name: Persistir estado de ofertas
        run: |
          if ! git diff --quiet -- data/state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/state.json
            git commit -m 'chore: atualiza estado das promoções [skip ci]'
            # A branch pode receber commits enquanto analisamos as ofertas.
            # Reaplicar nosso commit no topo evita erro "fetch first".
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'Conflito ao atualizar estado; nada foi sobrescrito.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo 'Histórico persistido com sucesso.'
                exit 0
              fi
              echo "Branch atualizada durante o push; tentativa $attempt/3"
              sleep 2
            done
            echo 'Não foi possível persistir o estado após 3 tentativas.'
            exit 1
          else
            echo 'Sem mudanças no estado.'
          fi
